# Auto Release Tag - after merged code passes main CI, create the next v* tag.
# The existing Release workflow remains responsible for GoReleaser publishing.
name: Auto Release Tag

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the release tag decision without pushing a tag"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      target_sha:
        description: "Optional commit SHA to inspect; defaults to main"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release-tag-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create release tag
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.target_sha || 'main' }}
          fetch-depth: 0

      - name: Read unreleased changelog version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines():
              match = re.match(r"^##\s+([0-9]+\.[0-9]+\.[0-9]+)\s+\(Unreleased\)\s*$", line)
              if match:
                  print(match.group(1))
                  break
          PY
          )"

          if [[ -z "${version}" ]]; then
            echo "No top-level CHANGELOG.md '## X.Y.Z (Unreleased)' entry found; skipping tag."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: existing
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; skipping tag creation."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag
        if: >
          steps.version.outputs.should_release == 'true' &&
          steps.existing.outputs.exists == 'false' &&
          github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"

      - name: Start release workflow
        if: >
          steps.version.outputs.should_release == 'true' &&
          steps.existing.outputs.exists == 'false' &&
          github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}"

      - name: Report decision
        shell: bash
        run: |
          set -euo pipefail
          echo "should_release=${{ steps.version.outputs.should_release }}"
          echo "tag=${{ steps.version.outputs.tag }}"
          echo "tag_exists=${{ steps.existing.outputs.exists }}"
          echo "dry_run=${{ github.event.inputs.dry_run }}"
