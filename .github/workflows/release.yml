# Release workflow — on a v* tag, GoReleaser cross-compiles the provider,
# generates SHA256SUMS, GPG-signs the checksums, and publishes a GitHub Release
# that the Terraform Registry auto-discovers.
#
# Required repository secrets:
#   GPG_PRIVATE_KEY — ASCII-armored private key registered with the Registry
#   PASSPHRASE      — passphrase for that key
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a main CI-verified version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf 'A stable version tag is required.\n' >&2; exit 1; }
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          result="$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$sha&per_page=1" --jq '.workflow_runs[0].conclusion')"
          [[ "$result" == success ]] || { printf 'Release commit has not passed main CI.\n' >&2; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
