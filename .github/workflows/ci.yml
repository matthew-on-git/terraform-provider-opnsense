# CI workflow — runs all DevRail checks and generated code validation.
# All jobs run inside the dev-toolchain container for consistent tooling.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: DevRail Check (lint, format, test, security, scan, docs)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/devrail-dev/dev-toolchain:1.12.24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - name: Install current golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Install current govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run all checks
        run: make _check
      - name: Retain Trivy failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-diagnostics-check
          path: .devrail-output/trivy.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  generate-check:
    name: Generated Code Check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/devrail-dev/dev-toolchain:1.12.24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true
      - name: Run go generate and verify no uncommitted changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go generate ./... && git diff --exit-code
        env:
          GOFLAGS: -buildvcs=false

      - name: Validate service package structure
        run: bash test/scripts/validate-structure.sh
